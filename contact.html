<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Hypnothérapie Moderne</title>
  <link rel="icon" type="image/png" href="./icon/hand-holding-hand-solid.svg">
  <link rel="stylesheet" href="style_v2.css" />
  <link rel="stylesheet" href="style_form.css" />
  <link rel="stylesheet" href="responsive_main.css" />
  <script src="https://kit.fontawesome.com/2f363087de.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Hypnose Moderne</a>
      <button class="hamburger" id="hamburger">&#9776;</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="hypnose.html">Hypnose</a></li>
        <li><a href="apropos.html">À propos de moi</a></li>
        <li><a href="tarifs.html">Tarifs</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <div class="container header-text">
      <h1>Contactez-moi</h1>
      <p>Vous avez une question ou souhaitez prendre rendez-vous ?</p>
    </div>
  </header>

  <!-- FORMULAIRE DE CONTACT -->
  <section class="container contact-form">
    <h2>Envoyez-moi un message</h2>
    <form
      action="https://formspree.io/f/xeolkvag"
      class="fs-form"
      target="_top"
      method="POST"
    >
      <div class="fs-field">
        <label class="fs-label" for="name">Nom</label>
        <input class="fs-input" id="name" name="name" required placeholder="Entrez votre nom complet"/>
      </div>
      <div class="fs-field">
        <label class="fs-label" for="email">Adresse email</label>
        <input class="fs-input" id="email" name="email" required placeholder="Votre adresse email pour que je puisse vous répondre"/>
      </div>
      <div class="fs-field">
        <label class="fs-label" for="number">Numéro de téléphone</label>
        <input class="fs-input" id="number" name="number" placeholder="Facultatif : votre numéro si vous préférez un appel"/>
      </div>
      <div class="fs-field">
        <label class="fs-label" for="message">Message</label>
        <textarea
          class="fs-textarea"
          id="message"
          name="message"
          required
          placeholder="Écrivez votre message ici..."
        ></textarea>
      </div>
      <div class="fs-button-group">
        <button class="fs-button" type="submit">Envoyer</button>
      </div>
    </form>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Hypnose Moderne – Olivier Royo. Tous droits réservés.</p>
  </footer>

  <!-- SCRIPT HAMBURGER -->
  <script>
    document.getElementById('hamburger').addEventListener('click', function () {
      document.getElementById('nav-links').classList.toggle('show');
    });
  </script>
</body>
</html>
